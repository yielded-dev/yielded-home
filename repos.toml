# Each command is an argument list executed in the component's checkout.
[profiles]
core = ["agent", "auth"]
libraries = ["agent", "auth", "sync", "automation"]
web = ["site"]
all = ["agent", "auth", "sync", "automation", "site"]

[repos.agent]
remote = "https://github.com/yielded-dev/agent.git"
role = "Agent runtime, platform and storage adapters, testing tools and examples"
guide = "docs/repos/agent.md"
tools = ["vp", "node"]
setup = [["vp", "install", "--frozen-lockfile"]]
checks = [["vp", "run", "ready"]]

[repos.auth]
remote = "https://github.com/yielded-dev/auth.git"
role = "Composable authentication, sessions, OAuth and persistence adapters"
guide = "docs/repos/auth.md"
tools = ["vp", "node"]
setup = [["vp", "install", "--frozen-lockfile"]]
checks = [["vp", "run", "ready"]]

[repos.sync]
remote = "https://github.com/yielded-dev/sync.git"
role = "Realtime synchronization contracts, client and server runtimes, and adapters"
guide = "docs/repos/sync.md"
tools = ["vp", "node"]
setup = [
  ["vp", "install", "--frozen-lockfile"],
  ["vp", "-C", "packages/local-indexeddb", "exec", "playwright", "install", "chromium"],
]
checks = [["vp", "run", "ready"]]

[repos.automation]
remote = "https://github.com/yielded-dev/automation.git"
role = "Event-driven automation and durable workspaces for agent execution"
guide = "docs/repos/automation.md"
tools = ["vp", "node", "initdb", "pg_ctl", "psql", "postgres"]
setup = [["vp", "install", "--frozen-lockfile"]]
checks = [
  ["vp", "run", "check"],
  ["vp", "run", "-F", "@yielded/automation", "test:e2e"],
  ["vp", "run", "check:packages"],
]

[repos.site]
remote = "https://github.com/yielded-dev/site.git"
role = "Landing page, hosted sign-in service and shared Starlight theme"
guide = "docs/repos/site.md"
tools = ["vp", "node"]
setup = [["vp", "install", "--frozen-lockfile"]]
checks = [["vp", "run", "ready"]]
